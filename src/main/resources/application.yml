server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/metricsdb}
    username: ${SPRING_DATASOURCE_USERNAME:metrics}
    password: ${SPRING_DATASOURCE_PASSWORD:metrics}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# OpenAPI JSON: GET /v3/api-docs ; UI: /swagger-ui/index.html (редирект с /swagger-ui.html)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{request-id:-}] %logger{36} - %msg%n"

app:
  logging:
    max-request-body-log-chars: 2048
  jwt:
    secret: ${APP_JWT_SECRET:replace-this-with-a-long-secure-base64-secret-replace-this-with-a-long-secure-base64-secret}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:3600}
  rate-limit:
    per-client-rps: ${APP_RATE_LIMIT_PER_CLIENT_RPS:10}
    global-rps: ${APP_RATE_LIMIT_GLOBAL_RPS:1000}
